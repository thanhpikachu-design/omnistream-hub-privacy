    function detectLang() {
      const q = new URLSearchParams(window.location.search).get('lang');
      const saved = localStorage.getItem('app_landing_lang');
      for (const raw of [q, saved, ...(navigator.languages || [navigator.language || 'en'])].filter(Boolean)) {
        if (PRIV[raw]) return raw;
        const l = raw.toLowerCase().replace('_', '-');
        if (l.startsWith('vi')) return 'vi';
        if (l.startsWith('es')) return 'es-419';
        if (l.startsWith('pt')) return 'pt-BR';
        if (l.startsWith('hi')) return 'hi-IN';
        if (l === 'id' || l.startsWith('id-') || l === 'in' || l.startsWith('in-')) return 'id';
        if (l.startsWith('ru')) return 'ru-RU';
        if (l.startsWith('ar')) return 'ar';
        if (l.startsWith('fr')) return 'fr-FR';
        if (l.startsWith('de')) return 'de-DE';
        if (l.startsWith('ja')) return 'ja-JP';
        if (l.startsWith('ko')) return 'ko-KR';
        if (l.startsWith('zh-tw') || l.startsWith('zh-hk') || l.startsWith('zh-hant')) return 'zh-TW';
        if (l.startsWith('zh')) return 'zh-CN';
        if (l.startsWith('tr')) return 'tr-TR';
        if (l.startsWith('th')) return 'th';
        if (l.startsWith('it')) return 'it-IT';
        if (l.startsWith('fil') || l.startsWith('tl')) return 'fil';
        if (l.startsWith('en')) return 'en-US';
      }
      return 'en-US';
    }
    const picker = document.getElementById('lang-picker');
    Object.entries(PRIV).forEach(([c, v]) => {
      const o = document.createElement('option'); o.value = c; o.textContent = `${v.flag} ${v.label}`; picker.appendChild(o);
    });
    function apply(c) {
      const d = PRIV[c] || PRIV['en-US'];
      document.documentElement.lang = c.split('-')[0];
      document.documentElement.dir = d.dir || 'ltr';
      document.getElementById('app-name').textContent = d.appName;
      document.getElementById('priv-title').textContent = d.ui.priv_title;
      document.getElementById('lbl-updated').textContent = d.ui.priv_updated;
      document.getElementById('s1-t').textContent = d.ui.priv_s1_t;
      document.getElementById('s1-d').textContent = d.ui.priv_s1_d;
      document.getElementById('s2-t').textContent = d.ui.priv_s2_t;
      document.getElementById('s2-d').textContent = d.ui.priv_s2_d;
      document.getElementById('s3-t').textContent = d.ui.priv_s3_t;
      document.getElementById('s3-d').textContent = d.ui.priv_s3_d;
      document.getElementById('priv-back').textContent = d.ui.priv_back;
      picker.value = c;
    }
    picker.addEventListener('change', e => { localStorage.setItem('app_landing_lang', e.target.value); apply(e.target.value); });
    apply(detectLang());
